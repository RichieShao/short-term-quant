<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141310" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- 设计系统 v3 字体：Fraunces(标题/英雄数字) · Instrument Sans(UI) · JetBrains Mono(数据) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>短线量化 · 分析系统</title>

    <!-- 防深色首屏闪白：在应用挂载前设定 data-theme（与 utils/theme.js 逻辑一致） -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('stq-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-2d8rywyw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C3Cu3ret.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
